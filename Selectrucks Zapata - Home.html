<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selectrucks Zapata — Camiones seminuevos verificados</title>
<meta name="description" content="Marketplace de camiones seminuevos verificados de Corporación Zapata. Más de 300 unidades en 9 sucursales de México. Financiamiento aprobado en 48 horas." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="sections.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="components-top.jsx"></script>
<script type="text/babel" src="components-bottom.jsx"></script>

<script type="text/babel">
function App() {
  const [filters, setFilters] = React.useState({});
  const [modalOpen, setModalOpen] = React.useState(false);
  const [modalUnit, setModalUnit] = React.useState(null);
  const [toast, setToast] = React.useState(null);

  const filtered = React.useMemo(() => {
    return UNITS.filter(u => {
      if (filters.brand && u.brand !== filters.brand) return false;
      if (filters.type && u.type !== filters.type) return false;
      if (filters.branch && u.branch !== filters.branch) return false;
      if (filters.price && (u.price < filters.price.min || u.price >= filters.price.max)) return false;
      if (filters.quick === 'featured' && !u.featured) return false;
      if (filters.quick === 'new' && u.status !== 'Nuevo ingreso') return false;
      if (filters.quick === 'offer' && u.status !== 'Oferta') return false;
      if (filters.quick === 'warranty' && !u.warranty) return false;
      return true;
    });
  }, [filters]);

  const openContact = (unit) => {
    setModalUnit(unit || null);
    setModalOpen(true);
  };
  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3200);
  };

  return (
    <>
      <Navbar onContact={() => openContact(null)} />
      <Hero onContact={() => openContact(null)} />
      <SearchBar filters={filters} setFilters={setFilters} resultsCount={filtered.length} />
      <Inventory filters={filters} setFilters={setFilters} onQuote={openContact} filtered={filtered} />
      <Trust />
      <FinStrip />
      <Branches />
      <Process />
      <CTAStrip onContact={() => openContact(null)} />
      <Footer />
      <ContactModal
        open={modalOpen}
        onClose={() => setModalOpen(false)}
        unit={modalUnit}
        onSubmit={() => showToast('✓ Solicitud enviada. Un asesor te contacta pronto.')}
      />
      <div className={`toast ${toast ? 'is-visible' : ''}`}>
        <Icon.Check />
        <span>{toast}</span>
      </div>
    </>
  );
}

// Wait until component scripts register on window
function mount() {
  if (!window.Navbar || !window.Inventory) { setTimeout(mount, 50); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script>

<!-- GSAP CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
// Animación de entrada del camión — espera a que React monte el DOM
(function initTruckAnimation() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function run() {
    const trail = document.querySelector('.hero__trail');
    const photo = document.querySelector('[data-gsap="truck-photo"]');
    if (!trail || !photo) { setTimeout(run, 80); return; }

    // Estado inicial: camión fuera de vista a la derecha, invisible
    gsap.set(photo, {
      x: 110,
      rotateY: -14,
      opacity: 0,
      transformPerspective: 900,
      transformOrigin: 'center center',
    });
    gsap.set(trail, { scaleX: 0, opacity: 0, transformOrigin: 'left center' });

    const tl = gsap.timeline({ delay: 0.25 });

    // 1. Trail aparece barriendo de izquierda a derecha
    tl.to(trail, { scaleX: 1, opacity: 1, duration: 0.38, ease: 'power2.out' })
    // 2. Camión entra desde la derecha con perspectiva 3D
      .to(photo, {
        x: 0,
        rotateY: -7,
        opacity: 1,
        duration: 0.72,
        ease: 'power3.out',
      }, '-=0.12')
    // 3. Trail se disuelve (se expande y desvanece — efecto de inercia)
      .to(trail, { opacity: 0, scaleX: 1.5, duration: 0.32, ease: 'power1.in' }, '-=0.35')
    // 4. Micro-bounce de aterrizaje (peso del camión)
      .to(photo, { scaleY: 0.972, duration: 0.07, ease: 'none' })
      .to(photo, { scaleY: 1, duration: 0.18, ease: 'bounce.out' });

    // 5. Hover GSAP (reemplaza el CSS hover que se removió)
    photo.addEventListener('mouseenter', () => {
      gsap.to(photo, { rotateY: 0, duration: 0.45, ease: 'back.out(1.4)', overwrite: 'auto' });
    });
    photo.addEventListener('mouseleave', () => {
      gsap.to(photo, { rotateY: -7, duration: 0.45, ease: 'back.out(1.4)', overwrite: 'auto' });
    });
  }

  run();
})();
</script>
</body>
</html>
