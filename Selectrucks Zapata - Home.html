<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selectrucks Zapata ? Camiones seminuevos verificados</title>
<meta name="description" content="Marketplace de camiones seminuevos verificados de Corporaci?n Zapata. M?s de 300 unidades en 10 sucursales de M?xico. Financiamiento aprobado en 48 horas." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="sections.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="components-top.jsx"></script>
<script type="text/babel" src="components-bottom.jsx"></script>

<script type="text/babel">
function App() {
  const [modalOpen, setModalOpen] = React.useState(false);
  const [modalUnit, setModalUnit] = React.useState(null);
  const [toast, setToast] = React.useState(null);

  const openContact = (unit) => {
    setModalUnit(unit || null);
    setModalOpen(true);
  };
  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3200);
  };

  return (
    <>
      <Navbar onContact={() => openContact(null)} />
      <Hero onContact={() => openContact(null)} />
      <FeaturedUnits onQuote={openContact} />
      <WhatDefinesUs />
      <ZapataSupport />
      <StatsBanner />
      <Branches />
      <CTAStrip onContact={() => openContact(null)} />
      <Footer />
      <ContactModal
        open={modalOpen}
        onClose={() => setModalOpen(false)}
        unit={modalUnit}
        onSubmit={() => showToast('? Solicitud enviada. Un asesor te contacta pronto.')}
      />
      <div className={`toast ${toast ? 'is-visible' : ''}`}>
        <Icon.Check />
        <span>{toast}</span>
      </div>
      <WhatsAppCTA />
    </>
  );
}

// Wait until component scripts register on window
function mount() {
  if (!window.Navbar || !window.WhatDefinesUs || !window.Branches || !window.WhatsAppCTA) { setTimeout(mount, 50); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script>

</body>
</html>
