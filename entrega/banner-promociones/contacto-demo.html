<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto (muestra) · SelecTrucks Zapata</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f4f4f4; color: #111; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: #555; margin: 0 0 24px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  select, textarea { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; border: 1px solid #bbb; border-radius: 6px; background: #fff; }
  textarea { min-height: 110px; }
  a { color: #ce0000; }
</style>
</head>
<body>
<main>
  <h1>Contacto (muestra)</h1>
  <p>Así llega el formulario cuando alguien da clic en el banner. El script de abajo es el mismo que viene en LEEME.txt.
     <a href="index.html">← Volver al banner</a></p>

  <form id="formulario">
    <label for="cf-sucursal">Sucursal</label>
    <select id="cf-sucursal" name="sucursal">
      <option value="">Seleccionar...</option>
      <option>Tlalnepantla</option>
      <option>CDMX Aeropuerto</option>
      <option>Monterrey</option>
      <option>Guadalajara</option>
      <option>GDL Occidente</option>
      <option>León</option>
      <option>Querétaro</option>
      <option>Tampico</option>
      <option>Celaya</option>
    </select>

    <label for="cf-motivo">Motivo</label>
    <select id="cf-motivo" name="motivo">
      <option value="">Seleccionar motivo...</option>
      <option>Promoción especial</option>
      <option>Gran Feria de Seminuevos</option>
      <option>Cotización de unidad</option>
      <option>Otro</option>
    </select>

    <label for="cf-mensaje">Mensaje</label>
    <textarea id="cf-mensaje" name="mensaje"></textarea>
  </form>
</main>

<script>
  // Llenado del formulario desde la dirección (?sucursal=…&motivo=…&mensaje=…). Ver LEEME.txt.
  (function () {
    var params = new URLSearchParams(window.location.search);
    function fill(id, value) {
      var el = document.getElementById(id);
      if (!el || !value) return;
      if (el.tagName === 'SELECT') {
        for (var i = 0; i < el.options.length; i++) {
          var o = el.options[i];
          if (o.value === value || o.text === value) { el.selectedIndex = i; return; }
        }
      } else {
        el.value = value;
      }
    }
    fill('cf-sucursal', params.get('sucursal'));
    fill('cf-motivo', params.get('motivo'));
    fill('cf-mensaje', params.get('mensaje'));
  })();
</script>
</body>
</html>
