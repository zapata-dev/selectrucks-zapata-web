<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario — Selectrucks Zapata (PDF)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  @page {
    size: A4;
    margin: 12mm 10mm;
  }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  html, body {
    background: var(--ink) !important;
    color: var(--white);
    font-family: 'Poppins', sans-serif;
  }
  body { margin: 0; padding: 0; }

  .pcontainer {
    max-width: 190mm;
    margin: 0 auto;
    padding: 0;
  }

  /* Cover header */
  .phead {
    background: var(--black);
    padding: 18mm 10mm 14mm;
    border-top: 3mm solid var(--red);
    margin-bottom: 8mm;
    position: relative;
  }
  .phead__logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12mm;
  }
  .phead__logo img { height: 14mm; }
  .phead__crumbs {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9pt;
    color: var(--fog);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4mm;
  }
  .phead__crumbs .current { color: var(--red); }
  .phead h1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 48pt;
    line-height: 0.9;
    letter-spacing: -0.02em;
    margin: 0 0 6mm;
    text-transform: uppercase;
  }
  .phead h1 em { font-style: normal; color: var(--red); }
  .phead__meta {
    display: flex;
    gap: 20mm;
    padding-top: 6mm;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9pt;
    color: var(--fog);
  }
  .phead__meta strong { display: block; color: var(--white); font-size: 18pt; font-weight: 700; margin-bottom: 2mm; }

  /* Sort/filter strip (static) */
  .pstrip {
    background: var(--graphite);
    border-left: 3px solid var(--red);
    padding: 4mm 6mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 10mm 6mm;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9pt;
    color: var(--bone);
    letter-spacing: 0.05em;
  }
  .pstrip strong { color: var(--red); font-size: 12pt; }
  .pstrip__chips { display: flex; gap: 4mm; color: var(--ash); }

  /* Card grid */
  .pgrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5mm;
    padding: 0 10mm 10mm;
  }
  .pcard {
    background: var(--graphite);
    border-top: 2px solid var(--red);
    page-break-inside: avoid;
    break-inside: avoid;
    display: flex;
    flex-direction: column;
  }
  .pcard__photo {
    aspect-ratio: 4/3;
    background: var(--ink);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background-image:
      linear-gradient(135deg, transparent 48%, rgba(206,0,0,0.08) 48%, rgba(206,0,0,0.08) 52%, transparent 52%),
      linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.04) 48%, rgba(255,255,255,0.04) 52%, transparent 52%);
    background-size: 32px 32px;
  }
  .pcard__photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .pcard__badges {
    position: absolute;
    top: 3mm;
    left: 3mm;
    display: flex;
    gap: 2mm;
  }
  .pcard__badge {
    background: var(--red);
    color: var(--white);
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 7pt;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 1.2mm 2.5mm;
  }
  .pcard__badge--dark {
    background: rgba(0,0,0,0.75);
    color: var(--white);
  }
  .pcard__status {
    position: absolute;
    top: 3mm;
    right: 3mm;
    background: var(--lime);
    color: var(--ink);
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: 7pt;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 1.2mm 2.5mm;
  }
  .pcard__status--new { background: var(--red); color: var(--white); }
  .pcard__status--offer { background: var(--white); color: var(--red); }

  .pcard__body {
    padding: 4mm 4mm 4mm;
  }
  .pcard__id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7pt;
    color: var(--ash);
    letter-spacing: 0.08em;
    margin-bottom: 1mm;
  }
  .pcard__title {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: 13pt;
    line-height: 1;
    margin-bottom: 2mm;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .pcard__sub {
    font-size: 8pt;
    color: var(--fog);
    margin-bottom: 3mm;
    line-height: 1.3;
  }
  .pcard__specs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2mm;
    padding: 3mm 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 3mm;
  }
  .pcard__spec {
    text-align: left;
  }
  .pcard__spec-k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 6pt;
    letter-spacing: 0.12em;
    color: var(--ash);
    text-transform: uppercase;
    margin-bottom: 0.8mm;
  }
  .pcard__spec-v {
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 10pt;
    color: var(--white);
  }
  .pcard__foot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .pcard__branch {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7pt;
    color: var(--fog);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .pcard__price {
    text-align: right;
  }
  .pcard__price-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 6pt;
    color: var(--ash);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .pcard__price-v {
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 15pt;
    color: var(--red);
    line-height: 1;
  }
  .pcard__price-mo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7pt;
    color: var(--lime);
    margin-top: 0.5mm;
  }

  /* Footer on every page */
  .pfooter {
    margin-top: 10mm;
    padding: 6mm 10mm;
    background: var(--black);
    border-top: 2px solid var(--red);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8pt;
    color: var(--fog);
    letter-spacing: 0.08em;
  }
  .pfooter strong { color: var(--white); }

  /* Section title (break pages thematically) */
  .psection {
    padding: 8mm 10mm 4mm;
    margin-bottom: 4mm;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    break-before: page;
  }
  .psection__eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9pt;
    color: var(--red);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 3mm;
  }
  .psection h2 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 26pt;
    line-height: 0.95;
    text-transform: uppercase;
    margin: 0;
  }
  .psection h2 em { font-style: normal; color: var(--red); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>

<script type="text/babel">
const CAT_UNITS = [
  ...UNITS,
  { id: 13, brand: 'Kenworth', model: 'T880', year: 2022, km: '180,000', engine: 'PACCAR MX-13 · 510hp', type: 'Volteo', price: 1820000, monthly: 42900, branch: 'Monterrey', featured: true, warranty: true, status: 'Nuevo ingreso' },
  { id: 14, brand: 'Freightliner', model: 'Columbia', year: 2017, km: '680,000', engine: 'DD13 · 470hp', type: 'Tractocamión', price: 580000, monthly: 13680, branch: 'León', featured: false, warranty: true, status: 'Oferta' },
  { id: 15, brand: 'International', model: 'ProStar', year: 2019, km: '490,000', engine: 'N13 · 450hp', type: 'Tractocamión', price: 890000, monthly: 20990, branch: 'Querétaro', featured: false, warranty: true, status: 'Disponible' },
  { id: 16, brand: 'Volvo', model: 'VNL 670', year: 2020, km: '340,000', engine: 'D13 · 455hp', type: 'Tractocamión', price: 1260000, monthly: 29800, branch: 'Guadalajara', featured: true, warranty: true, status: 'Disponible' },
  { id: 17, brand: 'Peterbilt', model: '389', year: 2018, km: '520,000', engine: 'PACCAR MX-13 · 485hp', type: 'Tractocamión', price: 1420000, monthly: 33500, branch: 'Tlalnepantla', featured: false, warranty: true, status: 'Disponible' },
  { id: 18, brand: 'Mack', model: 'Granite', year: 2019, km: '380,000', engine: 'MP7 · 405hp', type: 'Volteo', price: 980000, monthly: 23100, branch: 'Aeropuerto', featured: false, warranty: true, status: 'Disponible' },
  { id: 19, brand: 'Scania', model: 'G 410', year: 2020, km: '290,000', engine: 'DC13 · 410hp', type: 'Camión de carga', price: 1080000, monthly: 25400, branch: 'Tampico', featured: false, warranty: true, status: 'Disponible' },
  { id: 20, brand: 'Mercedes-Benz', model: 'Axor 2533', year: 2019, km: '410,000', engine: 'OM457 · 326hp', type: 'Camión de carga', price: 720000, monthly: 16980, branch: 'Celaya', featured: false, warranty: true, status: 'Oferta' },
  { id: 21, brand: 'Kenworth', model: 'T800', year: 2021, km: '220,000', engine: 'PACCAR MX-13', type: 'Pipa', price: 1550000, monthly: 36500, branch: 'Monterrey', featured: true, warranty: true, status: 'Nuevo ingreso' },
  { id: 22, brand: 'Freightliner', model: 'Cascadia', year: 2021, km: '280,000', engine: 'DD15 · 505hp', type: 'Tractocamión', price: 1380000, monthly: 32600, branch: 'Guadalajara', featured: true, warranty: true, status: 'Disponible' },
  { id: 23, brand: 'International', model: 'HV Series', year: 2020, km: '310,000', engine: 'A26 · 430hp', type: 'Refrigerado', price: 1150000, monthly: 27100, branch: 'Querétaro', featured: false, warranty: true, status: 'Disponible' },
  { id: 24, brand: 'Volvo', model: 'FH 460', year: 2018, km: '560,000', engine: 'D13 · 460hp', type: 'Cama baja', price: 890000, monthly: 20990, branch: 'Tlalnepantla', featured: false, warranty: true, status: 'Oferta' },
];

function PCard({ unit, idx }) {
  const statusClass = unit.status === 'Nuevo ingreso' ? 'pcard__status--new'
    : unit.status === 'Oferta' ? 'pcard__status--offer' : '';
  const code = 'STZ-' + String(unit.id).padStart(4, '0');
  return (
    <article className="pcard">
      <div className="pcard__photo">
        {unit.featured && <img src="assets/truck-cascadia-square.png" alt="" />}
        <div className="pcard__badges">
          <span className="pcard__badge">◆ {unit.branch}</span>
          {unit.warranty && <span className="pcard__badge pcard__badge--dark">Garantía</span>}
        </div>
        <span className={`pcard__status ${statusClass}`}>{unit.status}</span>
      </div>
      <div className="pcard__body">
        <div className="pcard__id">{code}</div>
        <h3 className="pcard__title">{unit.brand} {unit.model}</h3>
        <div className="pcard__sub">{unit.type} · {unit.engine}</div>
        <div className="pcard__specs">
          <div className="pcard__spec"><div className="pcard__spec-k">Año</div><div className="pcard__spec-v">{unit.year}</div></div>
          <div className="pcard__spec"><div className="pcard__spec-k">KM</div><div className="pcard__spec-v">{unit.km}</div></div>
          <div className="pcard__spec"><div className="pcard__spec-k">Tipo</div><div className="pcard__spec-v" style={{fontSize:'8pt'}}>{unit.type}</div></div>
        </div>
        <div className="pcard__foot">
          <div className="pcard__branch">◆ {unit.branch}</div>
          <div className="pcard__price">
            <div className="pcard__price-label">Precio contado</div>
            <div className="pcard__price-v">{fmtMXN(unit.price)}</div>
            <div className="pcard__price-mo">o {fmtMXN(unit.monthly)}/mes</div>
          </div>
        </div>
      </div>
    </article>
  );
}

function PApp() {
  // Group by type for thematic page breaks
  const groups = {};
  CAT_UNITS.forEach(u => { (groups[u.type] = groups[u.type] || []).push(u); });
  const orderedTypes = TYPES.filter(t => groups[t] && groups[t].length);

  const totalBranches = new Set(CAT_UNITS.map(u => u.branch)).size;

  return (
    <div className="pcontainer">
      <header className="phead">
        <div className="phead__logo">
          <img src="assets/logo-selectrucks.png" alt="Selectrucks Zapata" />
        </div>
        <div className="phead__crumbs">
          Inicio <span style={{color:'#555',margin:'0 6px'}}>/</span> <span className="current">Inventario completo</span>
        </div>
        <h1>Inventario<br/><em>completo</em></h1>
        <div className="phead__meta">
          <div><strong>{CAT_UNITS.length}</strong>Unidades verificadas</div>
          <div><strong>{totalBranches}</strong>Sucursales activas</div>
          <div><strong>150pt</strong>Inspección incluida</div>
          <div><strong>48h</strong>Aprobación de crédito</div>
        </div>
      </header>

      <div className="pstrip">
        <div><strong>{CAT_UNITS.length}</strong> resultados · Ordenados por tipo de unidad</div>
        <div className="pstrip__chips">
          Documento PDF · {new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' })}
        </div>
      </div>

      {orderedTypes.map((type, i) => (
        <React.Fragment key={type}>
          {i > 0 && (
            <div className="psection">
              <div className="psection__eyebrow">◆ Categoría {String(i + 1).padStart(2, '0')} / {String(orderedTypes.length).padStart(2, '0')}</div>
              <h2>{type} <em>· {groups[type].length} unidades</em></h2>
            </div>
          )}
          {i === 0 && (
            <div className="psection" style={{breakBefore: 'auto'}}>
              <div className="psection__eyebrow">◆ Categoría 01 / {String(orderedTypes.length).padStart(2, '0')}</div>
              <h2>{type} <em>· {groups[type].length} unidades</em></h2>
            </div>
          )}
          <div className="pgrid">
            {groups[type].map((u, idx) => <PCard key={u.id} unit={u} idx={idx} />)}
          </div>
        </React.Fragment>
      ))}

      <footer className="pfooter">
        <div>SELECTRUCKS <strong>ZAPATA</strong> · selectrucks.zapata.mx</div>
        <div>◆ CORPORACIÓN ZAPATA · 70 AÑOS</div>
      </footer>
    </div>
  );
}

function mount() {
  ReactDOM.createRoot(document.getElementById('root')).render(<PApp />);
  Promise.all([document.fonts ? document.fonts.ready : Promise.resolve()]).then(() => {
    setTimeout(() => { window.print(); }, 700);
  });
}
mount();
</script>
</body>
</html>
