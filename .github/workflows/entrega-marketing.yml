name: Entrega a Marketing

# Cada cambio que llega a main se copia, ya verificado, al repositorio de Marketing
# (zapata-dev/selectrucks-zapata-sitio). Qué entra y qué se revisa: scripts/actualizar_entrega.sh.
#
# Para escribir en ese repositorio usa una GitHub App de la organización (zapata-dev no permite deploy keys).
# Requisito único (lo configura Diego):
#   1. zapata-dev → Settings → Developer settings → GitHub Apps → New GitHub App: «selectrucks-entrega-marketing»,
#      sin webhook, permiso Repository → Contents: Read and write, «Only on this account».
#   2. Instalarla en zapata-dev SOLO en selectrucks-zapata-sitio.
#   3. Generar su llave privada (.pem).
#   4. selectrucks-zapata-web → Settings → Secrets and variables → Actions:
#        - Variables: ENTREGA_APP_CLIENT_ID = el Client ID de la App.
#        - Secrets:   ENTREGA_APP_PRIVATE_KEY = el contenido completo del .pem.
# Cada corrida saca un token que dura una hora, solo sirve para selectrucks-zapata-sitio y solo puede escribir su
# contenido; al final se revoca. No da acceso a nada más de la organización.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "render.yaml"
      - "extraer-frames.ps1"
      - "standalone-*src.html"
      - "*.standalone.jsx"
      - "* (standalone).html"
  workflow_dispatch:

permissions:
  contents: read

# Una entrega a la vez y en orden: si llegan dos fusiones seguidas, la segunda espera a la primera.
concurrency:
  group: entrega-marketing
  cancel-in-progress: false

jobs:
  entregar:
    name: entregar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Revisar la configuración de la App
        env:
          CLIENT_ID: ${{ vars.ENTREGA_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.ENTREGA_APP_PRIVATE_KEY }}
        run: |
          test -n "$CLIENT_ID" || { echo "::error::Falta la variable ENTREGA_APP_CLIENT_ID (ver el encabezado de este archivo)"; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "::error::Falta el secreto ENTREGA_APP_PRIVATE_KEY (ver el encabezado de este archivo)"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # gitleaks: misma versión y huella SHA-256 que usa go-on-camiones-web.
      - name: Instalar gitleaks
        run: |
          v=8.30.1
          a="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$a" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$a"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$a" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$a" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      # Token de corta duración, solo para selectrucks-zapata-sitio y solo con permiso de escribir su contenido.
      - name: Token para el repositorio de Marketing
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ENTREGA_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENTREGA_APP_PRIVATE_KEY }}
          owner: zapata-dev
          repositories: selectrucks-zapata-sitio
          permission-contents: write

      # El token viaja en una cabecera de la llamada a git y nunca se escribe en disco ni en la URL del remoto.
      - name: Clonar el repositorio de Marketing
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c http.extraheader="$AUTH" clone --depth 1 \
            https://github.com/zapata-dev/selectrucks-zapata-sitio.git "$RUNNER_TEMP/sitio"

      - name: Armar, verificar y dejar el commit
        env:
          GIT_AUTHOR_NAME: SelecTrucks Zapata (entrega automática)
          GIT_AUTHOR_EMAIL: dgarduno@zapata.com.mx
          GIT_COMMITTER_NAME: SelecTrucks Zapata (entrega automática)
          GIT_COMMITTER_EMAIL: dgarduno@zapata.com.mx
        run: bash scripts/actualizar_entrega.sh "$RUNNER_TEMP/sitio"

      - name: Subir a Marketing
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -C "$RUNNER_TEMP/sitio" -c http.extraheader="$AUTH" push origin HEAD:main
