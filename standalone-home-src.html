        <rect x="0" y="40" width="220" height="110" fill="#ce0000"/>
        <rect x="220" y="70" width="120" height="80" fill="#ce0000"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="components-top.standalone.jsx"></script>
<script type="text/babel" src="components-bottom.standalone.jsx"></script>

<script type="text/babel">
function App() {
  const [filters, setFilters] = React.useState({});
  const [modalOpen, setModalOpen] = React.useState(false);
  const [modalUnit, setModalUnit] = React.useState(null);
  const [toast, setToast] = React.useState(null);

  const filtered = React.useMemo(() => {
    return UNITS.filter(u => {
      if (filters.brand && u.brand !== filters.brand) return false;
      if (filters.type && u.type !== filters.type) return false;
      if (filters.branch && u.branch !== filters.branch) return false;
      if (filters.price && (u.price < filters.price.min || u.price >= filters.price.max)) return false;
      if (filters.quick === 'featured' && !u.featured) return false;
      if (filters.quick === 'new' && u.status !== 'Nuevo ingreso') return false;
      if (filters.quick === 'offer' && u.status !== 'Oferta') return false;
      if (filters.quick === 'warranty' && !u.warranty) return false;
      return true;
    });
  }, [filters]);

  const openContact = (unit) => { setModalUnit(unit || null); setModalOpen(true); };
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3200); };

  return (
    <>
      <Navbar onContact={() => openContact(null)} />
      <Hero onContact={() => openContact(null)} />
      <SearchBar filters={filters} setFilters={setFilters} resultsCount={filtered.length} />
      <Inventory filters={filters} setFilters={setFilters} onQuote={openContact} filtered={filtered} />
      <Trust />
      <FinStrip />
      <Branches />
      <Process />
      <CTAStrip onContact={() => openContact(null)} />
      <Footer />
      <ContactModal open={modalOpen} onClose={() => setModalOpen(false)} unit={modalUnit}
        onSubmit={() => showToast('âœ“ Solicitud enviada. Un asesor te contacta pronto.')} />
      <div className={`toast ${toast ? 'is-visible' : ''}`}>
        <Icon.Check /><span>{toast}</span>
      </div>
    </>
  );
}

function mount() {
  if (!window.Navbar || !window.Inventory) { setTimeout(mount, 50); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script>
</body>
</html>
